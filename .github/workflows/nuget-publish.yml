name: NuGet publish

# Publishes the client SDK (Castor.AI + Castor.AI.Contracts) to GitHub Packages on v*.*.* tags.
# Package version = tag without the "v".
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test Castor.AI.Tests/Castor.AI.Tests.csproj -c Release

      - name: Pack
        run: |
          dotnet pack Castor.AI.Contracts/Castor.AI.Contracts.csproj -c Release -o out -p:Version=$VERSION
          dotnet pack Castor.AI/Castor.AI.csproj -c Release -o out -p:Version=$VERSION

      - name: Push
        run: dotnet nuget push "out/*.nupkg" --source https://nuget.pkg.github.com/Castor-Studio/index.json --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
