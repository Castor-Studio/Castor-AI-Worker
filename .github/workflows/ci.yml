name: CI

# Tests and packs the client SDK (Castor.AI + Castor.AI.Contracts) without publishing.
# Packages are uploaded as an artifact (version 0.0.0-ci.<run>).
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.0.0-ci.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Castor.AI.Tests/Castor.AI.Tests.csproj -c Release

      - name: Pack
        run: |
          dotnet pack Castor.AI.Contracts/Castor.AI.Contracts.csproj -c Release -o out -p:Version=$VERSION
          dotnet pack Castor.AI/Castor.AI.csproj -c Release -o out -p:Version=$VERSION

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-${{ env.VERSION }}
          path: out/*.nupkg
